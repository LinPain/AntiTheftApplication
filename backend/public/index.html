<!DOCTYPE html>
<html>
<head>
    <title>Anti-Theft System - Real-time Tracking</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }
        #info {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 250px;
        }
        .status-online { color: #10B981; font-weight: bold; }
        .user-tag { background: #E2E8F0; padding: 4px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        button {
            transition: all 0.2s; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; padding: 35px; border-radius: 20px;
            text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
            font-size: 16px;
        }
        .error-msg { color: #EF4444; font-size: 0.85em; margin-top: 5px; min-height: 1.2em; }
    </style>
</head>
<body>
    <div id="login-overlay" class="login-overlay">
        <div class="login-box" id="step-1">
            <h2 style="margin-bottom: 5px;">Anti-Theft System</h2>
            <p style="color: #666; font-size: 0.9em;">Đăng nhập để giám sát thiết bị</p>
            <input type="text" id="username-input" placeholder="Username hoặc Email">
            <input type="password" id="password-input" placeholder="Mật khẩu">
            <div id="login-error" class="error-msg"></div>
            <button id="login-btn" style="width: 100%; padding: 14px; background: #3B82F6; color: white; margin-top: 15px;">ĐĂNG NHẬP</button>
            <button id="show-register-btn" style="width: 100%; padding: 8px; background: transparent; color: #3B82F6; margin-top: 10px; font-size: 0.85em;">Chưa có tài khoản? Đăng ký</button>
        </div>

        <div class="login-box" id="register-step" style="display: none;">
            <h2 style="margin-bottom: 5px;">Tạo tài khoản</h2>
            <p style="color: #666; font-size: 0.9em;">Tham gia hệ thống Zero Trust</p>
            <input type="text" id="reg-username" placeholder="Tên đăng nhập">
            <input type="text" id="reg-email" placeholder="Email">
            <input type="password" id="reg-password" placeholder="Mật khẩu">
            <div id="register-error" class="error-msg"></div>
            <button id="register-btn" style="width: 100%; padding: 14px; background: #3B82F6; color: white; margin-top: 15px;">ĐĂNG KÝ</button>
            <button id="back-to-login-btn" style="width: 100%; padding: 8px; background: transparent; color: #666; margin-top: 10px; font-size: 0.8em;">Đã có tài khoản? Đăng nhập</button>
        </div>

        <div class="login-box" id="step-2" style="display: none;">
            <h2 style="margin-bottom: 5px;">Xác thực OTP</h2>
            <p style="color: #666; font-size: 0.9em;">Mã đã được gửi đến email của bạn</p>
            <input type="text" id="otp-input" placeholder="Nhập 6 số OTP" maxlength="6" style="text-align: center; letter-spacing: 5px; font-weight: bold;">
            <div id="otp-error" class="error-msg"></div>
            <button id="verify-btn" style="width: 100%; padding: 14px; background: #10B981; color: white; margin-top: 15px;">XÁC MINH</button>
            <button id="back-to-login" style="width: 100%; padding: 8px; background: transparent; color: #666; margin-top: 10px; font-size: 0.8em;">Quay lại</button>
        </div>
    </div>

    <div id="info" style="display: none;">
        <h3 style="margin-top: 0;">🛡️ Monitor</h3>
        <p>User: <span id="display-username" class="user-tag">-</span></p>
        <p>Device: <span id="device-id" style="font-family: monospace;">android_device_1</span></p>
        <p>Status: <span id="status" class="status-online">LIVE (Real-time)</span></p>
        <p>Last Update: <span id="last-update">-</span></p>
        <hr style="border: 0.5px solid #eee; margin: 15px 0;">

        <button id="trigger-alarm" style="width: 100%; padding: 12px; background: #EF4444; color: white; margin-bottom: 8px;">🔔 TRIGGER ALARM</button>
        <button id="stop-alarm" style="width: 100%; padding: 12px; background: #10B981; color: white; margin-bottom: 8px; display: none;">🔕 STOP ALARM</button>
        <button id="trigger-lockdown" style="width: 100%; padding: 12px; background: #000; color: white;">🔒 FORCE LOCKDOWN</button>
        <button id="stop-lockdown" style="width: 100%; padding: 12px; background: #10B981; color: white; display: none;">🔓 RELEASE LOCKDOWN</button>
        <button id="track-now" style="width: 100%; padding: 12px; background: #3B82F6; color: white; margin-top: 10px;">📍 TRACK NOW</button>

        <div style="margin-top: 15px; display: flex; align-items: center; justify-content: space-between; font-size: 0.85em;">
            <span>Follow Device</span>
            <input type="checkbox" id="follow-toggle" checked style="width: auto; margin: 0;">
        </div>

        <button id="logout-btn" style="width: 100%; padding: 8px; background: #94A3B8; color: white; margin-top: 15px; font-size: 0.8em;">LOGOUT</button>

        <div id="log-container" style="margin-top: 15px; font-size: 0.75em; color: #666; max-height: 100px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 5px;">
            <div style="font-weight: bold; margin-bottom: 2px;">System Logs:</div>
            <div id="logs"></div>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let marker, activeUsername, authToken, socket;
        const deviceId = 'android_device_1';

        function addLog(msg, type = 'info') {
            const logs = document.getElementById('logs');
            if (!logs) return;
            const div = document.createElement('div');
            div.style.color = type === 'error' ? '#EF4444' : (type === 'success' ? '#10B981' : '#666');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.prepend(div);
            if (logs.children.length > 10) logs.lastChild.remove();
        }

        // UI Elements
        const step1 = document.getElementById('step-1');
        const regStep = document.getElementById('register-step');
        const step2 = document.getElementById('step-2');

        const loginBtn = document.getElementById('login-btn');
        const showRegisterBtn = document.getElementById('show-register-btn');
        const registerBtn = document.getElementById('register-btn');
        const backToLoginBtn = document.getElementById('back-to-login-btn');
        const verifyBtn = document.getElementById('verify-btn');

        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');

        const regUsernameInput = document.getElementById('reg-username');
        const regEmailInput = document.getElementById('reg-email');
        const regPasswordInput = document.getElementById('reg-password');

        const otpInput = document.getElementById('otp-input');
        const loginError = document.getElementById('login-error');
        const registerError = document.getElementById('register-error');
        const otpError = document.getElementById('otp-error');

        let mfaType = 'login'; // 'login' or 'register'

        // Navigation
        showRegisterBtn.addEventListener('click', () => { step1.style.display = 'none'; regStep.style.display = 'block'; });
        backToLoginBtn.addEventListener('click', () => { regStep.style.display = 'none'; step1.style.display = 'block'; });
        document.getElementById('back-to-login').addEventListener('click', () => { step2.style.display = 'none'; step1.style.display = 'block'; });

        // Registration
        registerBtn.addEventListener('click', async () => {
            const username = regUsernameInput.value.trim();
            const email = regEmailInput.value.trim();
            const password = regPasswordInput.value.trim();

            if (!username || !email || !password) { registerError.innerText = "Vui lòng nhập đầy đủ"; return; }

            registerBtn.disabled = true; registerError.innerText = "";
            try {
                console.log('Attempting registration for:', username);
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.status === 404) {
                    throw new Error("Endpoint not found (404). Please check server routes.");
                }

                const data = await response.json();

                if (response.ok) {
                    activeUsername = username;
                    mfaType = 'register';
                    document.querySelector('#step-2 h2').innerText = "Xác minh đăng ký";
                    document.querySelector('#step-2 p').innerText = "Mã xác minh đã được gửi đến email";
                    regStep.style.display = 'none'; step2.style.display = 'block';
                } else { registerError.innerText = data.error || "Đăng ký thất bại"; }
            } catch (e) { registerError.innerText = "Lỗi kết nối server"; }
            finally { registerBtn.disabled = false; }
        });

        // Step 1: Password Login
        loginBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) { loginError.innerText = "Vui lòng nhập đầy đủ"; return; }

            // Simulation: Calculate a random risk score for web demo
            const riskScore = Math.floor(Math.random() * 40);

            loginBtn.disabled = true; loginError.innerText = "";
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, riskScore })
                });
                const data = await response.json();

                if (response.ok) {
                    activeUsername = data.username; // Use canonical username from server
                    mfaType = 'login';
                    document.querySelector('#step-2 h2').innerText = "Xác thực OTP";
                    document.querySelector('#step-2 p').innerText = "Mã đã được gửi đến email của bạn";
                    step1.style.display = 'none'; step2.style.display = 'block';
                } else {
                    if (data.verificationRequired) {
                        activeUsername = data.username || username; // Use canonical if possible
                        mfaType = 'register';
                        document.querySelector('#step-2 h2').innerText = "Xác minh đăng ký";
                        step1.style.display = 'none'; step2.style.display = 'block';
                    }
                    loginError.innerText = data.error || "Đăng nhập thất bại";
                }
            } catch (e) { loginError.innerText = "Lỗi kết nối server"; }
            finally { loginBtn.disabled = false; }
        });

        // Step 2: OTP Verification
        verifyBtn.addEventListener('click', async () => {
            const otp = otpInput.value.trim();
            if (otp.length !== 6) { otpError.innerText = "Mã OTP phải có 6 số"; return; }

            verifyBtn.disabled = true; otpError.innerText = "";
            const endpoint = mfaType === 'login' ? '/api/auth/verify-otp' : '/api/auth/verify-registration';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: activeUsername, otp })
                });
                const data = await response.json();
                if (response.ok) {
                    if (mfaType === 'login') {
                        authToken = data.token;
                        startSession();
                    } else {
                        // After registration verification, go to login
                        alert("Xác minh thành công! Vui lòng đăng nhập.");
                        window.location.reload();
                    }
                } else { otpError.innerText = data.error || "Mã OTP không đúng"; }
            } catch (e) { otpError.innerText = "Lỗi kết nối server"; }
            finally { verifyBtn.disabled = false; }
        });

        function startSession() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            document.getElementById('display-username').innerText = activeUsername;

            initSocket();
            fetchLocation();
            updateStatusUI();
            setInterval(updateStatusUI, 10000); // Periodic status sync
        }

        function initSocket() {
            console.log('Attempting to connect to socket server...');
            // Support both WebSocket and Polling for better ngrok compatibility
            // Adding extraHeaders for ngrok bypass if possible (only works for polling transport)
            socket = io({
                auth: { token: authToken },
                extraHeaders: {
                    "ngrok-skip-browser-warning": "true"
                },
                reconnection: true,
                reconnectionAttempts: 10,
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                console.log('Successfully connected to real-time server as:', activeUsername);
                addLog('Real-time connection established', 'success');
                socket.emit('join', activeUsername);
                document.getElementById('status').innerText = "LIVE (Real-time)";
                document.getElementById('status').style.color = "#10B981";
            });

            socket.on('connect_error', (error) => {
                console.error('Socket Connection Error:', error.message);
                addLog(`Connection error: ${error.message}`, 'error');
                document.getElementById('status').innerText = "LIVE (Polling Fallback)";
                document.getElementById('status').style.color = "#F59E0B"; // Orange

                // Fallback to polling if socket fails
                if (!window.pollingInterval) {
                    console.log('Falling back to polling every 5s...');
                    window.pollingInterval = setInterval(fetchLocation, 5000);
                }
            });

            socket.on('locationUpdate', (data) => {
                console.log('Location update received via socket:', data);
                addLog(`Received location: ${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)}`, 'success');
                if (data.deviceId === deviceId) updateMarker(data.latitude, data.longitude, data.timestamp);
            });

            socket.on('statusUpdate', () => {
                console.log('Status update received via socket');
                updateStatusUI();
            });
        }

        async function secureFetch(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${authToken}`,
                'ngrok-skip-browser-warning': 'true'
            };
            const response = await fetch(url, options);
            if (response.status === 401 || response.status === 403) { window.location.reload(); }
            return response;
        }

        async function fetchLocation() {
            try {
                const response = await secureFetch(`/api/${activeUsername}/location/${deviceId}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    addLog('Historical data loaded');
                    updateMarker(data[0].latitude, data[0].longitude, data[0].timestamp);
                } else {
                    addLog('No location history found', 'info');
                }
            } catch (e) {
                console.error(e);
                addLog('Failed to fetch location history', 'error');
            }
        }

        async function updateStatusUI() {
            try {
                const response = await secureFetch(`/api/${activeUsername}/status`);
                const status = await response.json();
                document.getElementById('trigger-alarm').style.display = status.alarm.active ? 'none' : 'block';
                document.getElementById('stop-alarm').style.display = status.alarm.active ? 'block' : 'none';
                document.getElementById('trigger-lockdown').style.display = status.lockdown.active ? 'none' : 'block';
                document.getElementById('stop-lockdown').style.display = status.lockdown.active ? 'block' : 'none';
            } catch (e) { console.error(e); }
        }

        function updateMarker(lat, lon, timestamp) {
            const pos = [lat, lon];
            if (!marker) {
                marker = L.marker(pos).addTo(map);
                map.setView(pos, 16);
            } else {
                marker.setLatLng(pos);
                // Auto-center the map only if toggle is checked
                if (document.getElementById('follow-toggle').checked) {
                    map.panTo(pos, { animate: true, duration: 1.0 });
                }
            }
            document.getElementById('last-update').innerText = timestamp ? new Date(timestamp).toLocaleTimeString() : 'Vừa xong';

            // Visual pulse
            const indicator = document.getElementById('status');
            if (indicator) {
                indicator.style.color = '#3B82F6';
                setTimeout(() => indicator.style.color = '#10B981', 1000);
            }
        }

        document.getElementById('trigger-alarm').addEventListener('click', () => toggleCommand('alarm', true));
        document.getElementById('stop-alarm').addEventListener('click', () => toggleCommand('alarm', false));
        document.getElementById('trigger-lockdown').addEventListener('click', () => toggleCommand('lockdown', true));
        document.getElementById('stop-lockdown').addEventListener('click', () => toggleCommand('lockdown', false));
        document.getElementById('track-now').addEventListener('click', () => toggleCommand('track', true));

        async function toggleCommand(type, active) {
            const btn = type === 'track' ? document.getElementById('track-now') : null;
            const originalText = btn ? btn.innerText : '';

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerText = "📍 REQUESTING...";
                    btn.style.background = "#94A3B8";
                }

                await secureFetch(`/api/${activeUsername}/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: type !== 'track' ? JSON.stringify({ active }) : undefined
                });

                if (btn) {
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = originalText;
                        btn.style.background = "#3B82F6";
                    }, 2000);
                }

                updateStatusUI();
            } catch (e) {
                console.error(e);
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "❌ FAILED";
                    setTimeout(() => { btn.innerText = originalText; btn.style.background = "#3B82F6"; }, 2000);
                }
            }
        }

        document.getElementById('logout-btn').addEventListener('click', () => window.location.reload());
    </script>
</body>
</html>
