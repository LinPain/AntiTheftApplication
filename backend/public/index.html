<!DOCTYPE html>
<html>
<head>
    <title>Anti-Theft System - Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        #info {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 280px;
        }
        .status-online { color: #10B981; font-weight: bold; }
        .user-tag { background: #E2E8F0; padding: 4px 8px; border-radius: 6px; font-size: 0.9em; font-weight: bold; }
        button {
            transition: all 0.2s; border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .box {
            background: white; padding: 40px; border-radius: 25px;
            text-align: center; width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        input {
            width: 100%; padding: 14px; margin: 10px 0;
            border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box;
            font-size: 16px; outline: none;
        }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .error-msg { color: #EF4444; font-size: 0.85em; min-height: 1.5em; margin: 5px 0; }
        .loading { font-size: 0.85em; color: #3b82f6; margin-bottom: 10px; display: none; }
        .device-item {
            padding: 10px; border-radius: 8px; background: #f8fafc;
            margin-bottom: 8px; border: 1px solid #e2e8f0; font-size: 0.85em;
        }
        .device-item:hover { background: #f1f5f9; }
        .device-name { font-weight: bold; color: #1e293b; display: block; }
        .device-time { font-size: 0.8em; color: #64748b; }
        .btn-focus {
            margin-top: 5px; padding: 4px 8px; font-size: 0.75em;
            background: #3b82f6; color: white; border-radius: 4px;
            border: none; cursor: pointer;
        }
        .btn-delete {
            margin-top: 5px; margin-left: 5px; padding: 4px 8px; font-size: 0.75em;
            background: #EF4444; color: white; border-radius: 4px;
            border: none; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="login-overlay" class="overlay">
        <!-- STEP 1: LOGIN -->
        <div class="box" id="step-login">
            <h2 style="margin-bottom: 5px;">Anti-Theft System</h2>
            <p style="color: #64748b; font-size: 0.9em; margin-bottom: 25px;">Đăng nhập để giám sát thiết bị</p>
            <input type="text" id="login-user" placeholder="Username hoặc Email">
            <input type="password" id="login-pass" placeholder="Mật khẩu">
            <div id="login-error" class="error-msg"></div>
            <div id="login-loading" class="loading">⏳ Đang xác thực...</div>
            <button id="btn-login" style="width: 100%; padding: 15px; background: #3B82F6; color: white;">ĐĂNG NHẬP</button>
            <div style="margin-top: 20px; font-size: 0.85em;">
                <span id="go-reg" style="color: #3b82f6; cursor: pointer;">Đăng ký</span> |
                <span id="go-forgot" style="color: #64748b; cursor: pointer;">Quên mật khẩu?</span>
            </div>
        </div>

        <!-- STEP 2: OTP -->
        <div class="box" id="step-otp" style="display: none;">
            <h2 id="otp-title">Xác thực OTP</h2>
            <p id="otp-subtitle" style="color: #64748b; font-size: 0.9em;">Mã đã được gửi đến email</p>
            <input type="text" id="otp-code" placeholder="Nhập 6 số mã OTP" maxlength="6" style="text-align: center; letter-spacing: 5px; font-weight: bold;">
            <div id="otp-error" class="error-msg"></div>
            <button id="btn-verify" style="width: 100%; padding: 15px; background: #10B981; color: white;">XÁC MINH</button>
            <div style="margin-top: 15px;">
                <span id="btn-resend" style="color: #3b82f6; font-size: 0.85em; cursor: pointer;">Gửi lại mã</span>
                <div id="timer" style="font-size: 0.8em; color: #94a3b8; display: none;">Gửi lại sau <span id="sec">30</span>s</div>
            </div>
            <button id="back-to-login" style="margin-top: 15px; background: transparent; color: #64748b; font-size: 0.85em;">Quay lại</button>
        </div>

        <!-- STEP 3: REGISTER -->
        <div class="box" id="step-reg" style="display: none;">
            <h2>Tạo tài khoản</h2>
            <input type="text" id="reg-user" placeholder="Tên đăng nhập">
            <input type="text" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Mật khẩu">
            <div id="reg-error" class="error-msg"></div>
            <div id="reg-loading" class="loading">⏳ Đang gửi yêu cầu...</div>
            <button id="btn-reg" style="width: 100%; padding: 15px; background: #3B82F6; color: white;">ĐĂNG KÝ</button>
            <button id="reg-to-login" style="margin-top: 15px; background: transparent; color: #64748b; font-size: 0.85em;">Đã có tài khoản? Đăng nhập</button>
        </div>
    </div>

    <!-- DASHBOARD INFO -->
    <div id="info" style="display: none;">
        <h3 style="margin-top: 0; display: flex; align-items: center; gap: 8px;">🛡️ Dashboard</h3>
        <p style="margin: 8px 0;">User: <span id="view-user" class="user-tag">-</span></p>
        <p style="margin: 8px 0;">Status: <span id="view-status" class="status-online">CONNECTED</span></p>

        <div style="margin: 15px 0;">
            <label for="device-selector" style="font-size: 0.8em; color: #64748b; font-weight: bold; display: block; margin-bottom: 5px;">📍 THEO DÕI THIẾT BỊ:</label>
            <select id="device-selector" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; outline: none; cursor: pointer;">
                <option value="all">Tất cả thiết bị</option>
            </select>
        </div>

        <hr style="border: 0.5px solid #f1f5f9; margin: 15px 0;">

        <button id="cmd-alarm" style="width: 100%; padding: 12px; background: #EF4444; color: white; margin-bottom: 8px;">🔔 TRIGGER ALARM</button>
        <button id="cmd-stop-alarm" style="width: 100%; padding: 12px; background: #10B981; color: white; margin-bottom: 8px; display: none;">🔕 STOP ALARM</button>

        <button id="cmd-lost" style="width: 100%; padding: 12px; background: #E53935; color: white;">🚩 REPORT LOST</button>
        <button id="cmd-stop-lost" style="width: 100%; padding: 12px; background: #10B981; color: white; display: none;">🏳️ STOP LOST MODE</button>

        <button id="cmd-track" style="width: 100%; padding: 12px; background: #3B82F6; color: white; margin-top: 15px;">📍 TRACK NOW</button>

        <div style="margin-top: 20px;">
            <label style="font-size: 0.8em; color: #64748b; font-weight: bold; display: block; margin-bottom: 10px;">📱 DANH SÁCH THIẾT BỊ:</label>
            <div id="device-list"></div>
        </div>

        <button id="btn-logout" style="width: 100%; padding: 10px; background: #94A3B8; color: white; margin-top: 25px; font-size: 0.8em;">ĐĂNG XUẤT</button>

        <div id="logs" style="margin-top: 20px; font-size: 0.7em; color: #64748b; max-height: 80px; overflow-y: auto; border-top: 1px solid #f1f5f9; padding-top: 10px;"></div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([10.762622, 106.660172], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let activeUser, token, socket, mfaMode = 'LOGIN';
        const markers = {}; // Store markers by deviceId
        let selectedDeviceId = 'all';

        const deviceSelector = document.getElementById('device-selector');
        deviceSelector.onchange = (e) => {
            selectedDeviceId = e.target.value;
            if (selectedDeviceId !== 'all' && markers[selectedDeviceId]) {
                map.panTo(markers[selectedDeviceId].getLatLng());
                markers[selectedDeviceId].openPopup();
            }
        };

        // --- HELPERS ---
        async function apiCall(url, body) {
            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body: JSON.stringify(body)
            });
        }

        async function secureCall(url, method = 'GET', body = null) {
            return fetch(url, {
                method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: body ? JSON.stringify(body) : null
            });
        }

        function showStep(id) {
            ['step-login', 'step-otp', 'step-reg'].forEach(s => document.getElementById(s).style.display = s === id ? 'block' : 'none');
        }

        // --- AUTH LOGIC ---
        document.getElementById('btn-login').onclick = async () => {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;
            const err = document.getElementById('login-error');
            const load = document.getElementById('login-loading');

            if(!user || !pass) { err.innerText = "Nhập đủ thông tin"; return; }
            err.innerText = ""; load.style.display = "block";

            try {
                const res = await apiCall('/api/auth/login', { username: user, password: pass });
                const data = await res.json();
                load.style.display = "none";

                if(res.ok) {
                    activeUser = data.username;
                    mfaMode = 'LOGIN';
                    showStep('step-otp');
                    if(data.mockCode) console.log("OTP:", data.mockCode);
                } else { err.innerText = data.error || "Lỗi đăng nhập"; }
            } catch(e) { err.innerText = "Lỗi kết nối server"; load.style.display = "none"; }
        };

        document.getElementById('btn-verify').onclick = async () => {
            const code = document.getElementById('otp-code').value.trim();
            const err = document.getElementById('otp-error');
            const endpoint = mfaMode === 'LOGIN' ? '/api/auth/verify-otp' : '/api/auth/verify-registration';

            try {
                const res = await apiCall(endpoint, { username: activeUser, otp: code });
                const data = await res.json();
                if(res.ok) {
                    if(mfaMode === 'LOGIN') {
                        token = data.token; activeUser = data.username;
                        startDashboard();
                    } else { alert("Xác minh thành công! Hãy đăng nhập."); window.location.reload(); }
                } else { err.innerText = data.error || "Mã không đúng"; }
            } catch(e) { err.innerText = "Lỗi xác thực"; }
        };

        function startDashboard() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            document.getElementById('view-user').innerText = activeUser;
            fetchDevices();
            initSocket();
            updateStatus();
            setInterval(updateStatus, 10000);
        }

        async function fetchDevices() {
            try {
                const res = await secureCall(`/api/${activeUser}/location/devices/status`);
                if (res.ok) {
                    const devices = await res.json();
                    deviceSelector.innerHTML = '<option value="all">Tất cả thiết bị</option>';
                    const listContainer = document.getElementById('device-list');
                    listContainer.innerHTML = '';

                    devices.forEach(dev => {
                        const devId = dev._id;
                        const devName = dev.deviceName || devId;

                        // Add to dropdown
                        const opt = document.createElement('option');
                        opt.value = devId;
                        opt.innerText = devName;
                        deviceSelector.appendChild(opt);

                        // Add/Update in List UI
                        createOrUpdateDeviceListItem(devId, devName, dev.lastTimestamp);

                        // Update marker
                        updateMarker(devId, devName, dev.lastLatitude, dev.lastLongitude);
                    });
                }
            } catch (e) { console.error("Failed to fetch devices", e); }
        }

        function createOrUpdateDeviceListItem(devId, devName, timestamp) {
            const listContainer = document.getElementById('device-list');
            let item = document.getElementById(`list-item-${devId}`);

            if (!item) {
                item = document.createElement('div');
                item.id = `list-item-${devId}`;
                item.className = 'device-item';
                listContainer.appendChild(item);
            }

            item.innerHTML = `
                <span class="device-name">${devName}</span>
                <span class="device-time">Cập nhật: ${new Date(timestamp).toLocaleString()}</span>
                <div style="display: flex;">
                    <button class="btn-focus" onclick="focusDevice('${devId}')">XEM TRÊN BẢN ĐỒ</button>
                    <button class="btn-delete" onclick="deleteDevice('${devId}')">GỠ BỎ</button>
                </div>
            `;
        }

        window.focusDevice = (devId) => {
            deviceSelector.value = devId;
            selectedDeviceId = devId;
            if (markers[devId]) {
                map.panTo(markers[devId].getLatLng());
                markers[devId].openPopup();
            }
        };

        window.deleteDevice = async (devId) => {
            if (!confirm(`Bạn có chắc muốn gỡ thiết bị ${devId} và xóa toàn bộ lịch sử?`)) return;
            const res = await secureCall(`/api/${activeUser}/location/${devId}`, 'DELETE');
            if (res.ok) {
                // Remove marker from map
                if (markers[devId]) {
                    map.removeLayer(markers[devId]);
                    delete markers[devId];
                }
                fetchDevices();
            } else {
                alert("Lỗi khi gỡ thiết bị.");
            }
        };

        function initSocket() {
            socket = io({
                auth: { token },
                extraHeaders: { "ngrok-skip-browser-warning": "true" },
                transports: ['websocket', 'polling'] // Ensure compatibility
            });

            socket.on('connect', () => {
                console.log("✅ Socket connected to room:", activeUser.toLowerCase());
                socket.emit('join', activeUser.toLowerCase());
            });

            socket.on('connect_error', (err) => {
                console.error("❌ Socket Connection Error:", err.message);
            });

            socket.on('locationUpdate', (d) => {
                const displayName = d.deviceName || d.deviceId;
                console.log(`📍 Real-time Location Received from ${displayName}:`, d.latitude, d.longitude);

                // Update Marker on Map
                updateMarker(d.deviceId, displayName, d.latitude, d.longitude);

                // Update text list on the right
                createOrUpdateDeviceListItem(d.deviceId, displayName, d.timestamp || Date.now());

                // Add to selector if new
                if (![...deviceSelector.options].some(o => o.value === d.deviceId)) {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.innerText = displayName;
                    deviceSelector.appendChild(opt);
                }
            });

            socket.on('statusUpdate', () => {
                console.log("🔄 Status Update Received");
                updateStatus();
            });
        }

        async function updateStatus() {
            const res = await secureCall(`/api/${activeUser}/status`);
            if(res.ok) {
                const s = await res.json();
                document.getElementById('cmd-alarm').style.display = s.alarm.active ? 'none' : 'block';
                document.getElementById('cmd-stop-alarm').style.display = s.alarm.active ? 'block' : 'none';
                document.getElementById('cmd-lost').style.display = s.lostMode.active ? 'none' : 'block';
                document.getElementById('cmd-stop-lost').style.display = s.lostMode.active ? 'block' : 'none';
            }
        }

        function updateMarker(deviceId, deviceName, lat, lon) {
            if (!lat || !lon) return;

            const label = deviceName || deviceId;

            if(!markers[deviceId]) {
                markers[deviceId] = L.marker([lat, lon]).addTo(map).bindPopup(`<b>Device:</b> ${label}`);
            } else {
                markers[deviceId] = markers[deviceId].setLatLng([lat, lon]);
                markers[deviceId].getPopup().setContent(`<b>Device:</b> ${label}`);
            }

            // Auto-focus logic: Only jump if a specific device is selected
            if (selectedDeviceId === deviceId) {
                map.setView([lat, lon], map.getZoom());
            }
        }

        // --- COMMANDS ---
        document.getElementById('cmd-alarm').onclick = () => secureCall(`/api/${activeUser}/alarm`, 'POST', { active: true });
        document.getElementById('cmd-stop-alarm').onclick = () => secureCall(`/api/${activeUser}/alarm`, 'POST', { active: false });
        document.getElementById('cmd-lost').onclick = () => {
            const p = prompt("Số điện thoại:", "0123456789");
            if(p) secureCall(`/api/${activeUser}/lost-mode`, 'POST', { active: true, message: "DEVICE LOST", phoneNumber: p });
        };
        document.getElementById('cmd-stop-lost').onclick = () => secureCall(`/api/${activeUser}/lost-mode`, 'POST', { active: false });
        document.getElementById('cmd-track').onclick = () => secureCall(`/api/${activeUser}/track`, 'POST', { active: true });

        // --- NAV ---
        document.getElementById('go-reg').onclick = () => showStep('step-reg');
        document.getElementById('reg-to-login').onclick = () => showStep('step-login');
        document.getElementById('back-to-login').onclick = () => showStep('step-login');
        document.getElementById('btn-logout').onclick = () => window.location.reload();

        document.getElementById('btn-reg').onclick = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const e = document.getElementById('reg-email').value.trim();
            const p = document.getElementById('reg-pass').value;
            const err = document.getElementById('reg-error');
            if(!u || !e || !p) { err.innerText = "Nhập đủ thông tin"; return; }
            err.innerText = "";
            const res = await apiCall('/api/auth/register', { username: u, email: e, password: p });
            const data = await res.json();
            if(res.ok) { activeUser = u; mfaMode = 'REG'; showStep('step-otp'); }
            else { err.innerText = data.error; }
        };
    </script>
</body>
</html>
